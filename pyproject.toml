[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "urja-api"
version = "1.0.0"
description = "A documented, read-only API over the Urja Meter Ops portal"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "openapi-spec-validator>=0.7,<1"]

[tool.setuptools.packages.find]
include = ["urja_api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

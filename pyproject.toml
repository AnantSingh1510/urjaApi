[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "urja-api"
version = "1.0.0"
description = "A documented, read-only API over the Urja Meter Ops portal"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3", "uvicorn>=0.34,<1"]

[tool.setuptools.packages.find]
include = ["urja_api*"]
